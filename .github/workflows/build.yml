name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Generate Xcode project manually
        run: |
          mkdir -p DSHMobile.xcodeproj
          # 用 Ruby 的 xcodeproj gem 来生成工程，避开 XcodeGen
          gem install xcodeproj
          ruby -e "
            require 'xcodeproj'
            project = Xcodeproj::Project.new('DSHMobile.xcodeproj')
            target = project.new_target(:application, 'DSHMobile', :ios, '16.0')
            # 添加 Sources 目录下的 swift 文件
            Dir.glob('Sources/*.swift').each do |file|
              file_ref = project.main_group.new_file(file)
              target.add_file_references([file_ref])
            end
            # 添加 Info.plist 配置
            target.build_configurations.each do |config|
              config.build_settings['INFOPLIST_FILE'] = 'Sources/Info.plist'
              config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = 'com.liaojinxuan666.DSHMobile'
              config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
              config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
              config.build_settings['TARGETED_DEVICE_FAMILY'] = '1,2'
            end
            project.save
          "
          
      - name: Create Info.plist
        run: |
          mkdir -p Sources
          cat > Sources/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>DSHMobile</string>
              <key>CFBundleIdentifier</key>
              <string>com.liaojinxuan666.DSHMobile</string>
              <key>CFBundleName</key>
              <string>DSHMobile</string>
              <key>CFBundleDisplayName</key>
              <string>DSH Mobile</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsLocalNetworking</key>
                  <true/>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
          </dict>
          </plist>
          EOF

      - name: Download Alpine rootfs
        run: |
          mkdir -p Resources
          curl -L -o Resources/alpine-minirootfs.tar.gz https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/aarch64/alpine-minirootfs-3.20.3-aarch64.tar.gz
          echo "=== 下载完成 ==="
          ls -lh Resources/

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project DSHMobile.xcodeproj \
            -scheme DSHMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/DSHMobile.app Payload/
          
          # 把下载好的 Alpine 资源塞进 App 包
          mkdir -p Payload/DSHMobile.app/Resources
          cp -r Resources/* Payload/DSHMobile.app/Resources/
          
          zip -qr DSHMobile-unsigned.ipa Payload
          echo "=== 检查 App 包内的资源 ==="
          ls -lh Payload/DSHMobile.app/Resources/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSHMobile-unsigned-ipa
          path: DSHMobile-unsigned.ipa