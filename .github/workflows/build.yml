name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # 在一切开始之前，手写一个绝对完美的 Info.plist
      - name: Force create perfect Info.plist
        run: |
          mkdir -p Sources
          cat > Sources/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>DSHMobile</string>
              <key>CFBundleIdentifier</key>
              <string>com.liaojinxuan666.DSHMobile</string>
              <key>CFBundleName</key>
              <string>DSHMobile</string>
              <key>CFBundleDisplayName</key>
              <string>DSH Mobile</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIApplicationSceneManifest</key>
              <dict>
                  <key>UIApplicationSupportsMultipleScenes</key>
                  <false/>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsLocalNetworking</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Download Alpine rootfs
        run: |
          mkdir -p Resources
          curl -L -o Resources/alpine-minirootfs.tar.gz https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/aarch64/alpine-minirootfs-3.20.3-aarch64.tar.gz

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project DSHMobile.xcodeproj \
            -scheme DSHMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            GENERATE_INFOPLIST_FILE=NO \
            INFOPLIST_FILE=Sources/Info.plist \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/DSHMobile.app Payload/
          mkdir -p Payload/DSHMobile.app/Resources
          cp -r Resources/* Payload/DSHMobile.app/Resources/
          zip -qr DSHMobile-unsigned.ipa Payload
          
          echo "================ 强制验证检查 ================"
          # 如果打包后的 Info.plist 里没有 CFBundleIdentifier，直接报错退出，不生成废包！
          if ! plutil -p Payload/DSHMobile.app/Info.plist | grep -q "CFBundleIdentifier"; then
            echo "❌ 致命错误：打包后的 Info.plist 里依然没有 CFBundleIdentifier！"
            exit 1
          fi
          echo "✅ 成功！Info.plist 里包含 CFBundleIdentifier。"
          plutil -p Payload/DSHMobile.app/Info.plist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSHMobile-unsigned-ipa
          path: DSHMobile-unsigned.ipa