name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Download Alpine rootfs
        run: |
          mkdir -p Resources
          curl -L -o Resources/alpine-minirootfs.tar.gz https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/aarch64/alpine-minirootfs-3.20.3-aarch64.tar.gz
          echo "=== 下载完成 ==="
          ls -lh Resources/

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project DSHMobile.xcodeproj \
            -scheme DSHMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/DSHMobile.app Payload/
          
          # 把 Alpine 资源塞进 App 包
          mkdir -p Payload/DSHMobile.app/Resources
          cp -r Resources/* Payload/DSHMobile.app/Resources/
          
          zip -qr DSHMobile-unsigned.ipa Payload
          
          echo "=== 检查打包后的 Info.plist 内容 ==="
          plutil -p Payload/DSHMobile.app/Info.plist
          echo "=== 检查 App 包内的资源 ==="
          ls -lh Payload/DSHMobile.app/Resources/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSHMobile-unsigned-ipa
          path: DSHMobile-unsigned.ipa