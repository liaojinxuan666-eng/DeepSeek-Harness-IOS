name: DSHMobile
options:
  bundleIdPrefix: com.liaojinxuan666
  deploymentTarget:
    iOS: "16.0"
targets:
  DSHMobile:
    type: application
    platform: iOS
    sources: [Sources]
    # 核心修复：让 XcodeGen 帮我们生成一个完整的 Info.plist，而不是让 Xcode 自动生成
    info:
      path: Sources/Info.plist
      properties:
        CFBundleExecutable: DSHMobile
        CFBundleIdentifier: com.liaojinxuan666.DSHMobile
        CFBundleName: DSHMobile
        CFBundleDisplayName: DSH Mobile
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        TARGETED_DEVICE_FAMILY: "1,2"