name: DSHMobile
options:
  bundleIdPrefix: com.liaojinxuan666
  deploymentTarget:
    iOS: "16.0"
targets:
  DSHMobile:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liaojinxuan666.DSHMobile
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        # 核心修正：让 Xcode 自动生成 Info.plist，避免手动拼写遗漏
        GENERATE_INFOPLIST_FILE: YES
        # 通过这里给生成的 plist 注入我们需要的字段
        INFOPLIST_KEY_CFBundleDisplayName: DSH Mobile
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES