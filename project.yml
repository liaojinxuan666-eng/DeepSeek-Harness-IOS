name: DSHMobile
options:
  bundleIdPrefix: com.liaojinxuan666
  deploymentTarget:
    iOS: "16.0"
targets:
  DSHMobile:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        # 核心修复：禁止 Xcode 自动生成 plist，强制使用我们写的
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.liaojinxuan666.DSHMobile
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        TARGETED_DEVICE_FAMILY: "1,2"