name: DSHMobile
options:
  bundleIdPrefix: com.liaojinxuan666
  deploymentTarget:
    iOS: "16.0"
targets:
  DSHMobile:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleExecutable: DSHMobile
        CFBundleIdentifier: com.liaojinxuan666.DSHMobile
        CFBundleName: DSHMobile
        CFBundleDisplayName: DSH Mobile
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        # 核心修复：加上了 SwiftUI 必须的 Scene 清单
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        TARGETED_DEVICE_FAMILY: "1,2"